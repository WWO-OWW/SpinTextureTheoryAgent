schema_version: "2.0.0"
evidence_status_schema_version: "1.0.0"
knowledge_lifecycle:
  # Legacy compatibility labels. Each route value is derived from evidence_status.
  - candidate
  - symmetry_checked
  - cas_validated
  - expert_validated
  - benchmarked
  - released

routes:
  - route_id: afm_stripe_sot_full
    material: collinear_antiferromagnet
    texture: stripe_domain
    drive: spin_orbit_torque
    geometry: thin_film_2d
    required_goals: [derive_sigma_model, collective_coordinate_projection, linear_stability]
    required_assumptions:
      - sot_force_density_explicit
      - symbolic_spin_polarization
      - pinned_internal_wall_angles
      - phenomenological_nearest_neighbor_stiffness
      - periodic_wall_chain
      - localized_wall_boundary_terms_vanish
    support_level: full_derivation
    evidence_status:
      claim_class: known_theory
      cas_execution: passed
      analytic_reproduction: passed
      literature_reproduction: passed
      assertion_coverage: passed
      benchmark: registered
      cross_engine: passed
      external_review: pending
      public_release: passed
    requires_human_review: false
    permitted_claim: Complete executable AFM sigma-model and wall-chain derivation under the registered rigid-wall, force, boundary, and stiffness assumptions.
    blocked_claims:
      - Material-specific quantitative prediction without fitted parameters.
      - Unpinned internal-angle or nonlocal wall-interaction dynamics.
    evidence:
      public_release_records:
        - public_release_evidence/v0.1.0/public_release_evidence_record.yaml
      config: configs/afm_stripe_sot.yaml
      benchmark_cases: [benchmark_cases/A4_afm_stripe_sot.yaml]
      evidence_card: evidence_cards/core3/A4_afm_stripe_sot.yaml
      independent_gold_script: mathematica/gold/A4_afm_stripe_sot_gold.wl
      machine_audit_spec: machine_audit_specs/core3/A4_afm_stripe_sot.yaml
      assertion_coverage_registry: knowledge_base/assertion_coverage.yaml
      cas_execution_records:
        - analysis/evidence_runs/core3_latest/A4_afm_stripe_sot_evidence/evidence_result.json
      analytic_reproduction_records:
        - analysis/evidence_runs/core3_latest/A4_afm_stripe_sot_evidence/evidence_result.json
      assertion_coverage_records:
        - analysis/assertion_coverage/literature_02/assertion_coverage.json
      cross_engine_records:
        - analysis/cross_engine/core3_latest/A4_afm_stripe_sot/cross_engine_result.json
      literature_reproduction_record: literature_reproduction_records/core3/A4_afm_stripe_sot.yaml
      wolfram_functions:
        - AFMSigmaEquation
        - DomainWallAnsatz
        - CollectiveMassMatrix
        - CollectiveDampingMatrix
        - GeneralizedForce
        - LinearStabilityMatrix
      validator_checks:
        - afm_dynamics_type
        - dmi_symmetry
        - collective_boundary_terms
        - stripe_stiffness_review
      references: []
    missing_evidence: []
    promotion_requirements: []
    limitations:
      - Rigid fixed-width walls with pinned internal angles.
      - Nearest-neighbor wall stiffness is phenomenological.

