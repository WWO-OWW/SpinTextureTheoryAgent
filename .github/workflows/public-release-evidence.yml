name: Public release evidence

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package and test dependency
        run: python -m pip install . pytest
      - name: Verify public release snapshot
        run: |
          python release_tools/project1_publication.py verify-public-snapshot \
            --snapshot public_release_evidence/v0.1.0 --require-pass
      - name: Run public evidence regressions
        run: |
          python -m pytest -q tests/test_public_release_snapshot.py
          python -m pytest -q release_tools/tests/test_project1_collection_publication.py
      - name: Run portable CLI smoke checks
        run: |
          python -m spintexture_agent.cli validate configs/afm_stripe_sot.yaml
          python -m spintexture_agent.cli plan configs/afm_stripe_sot.yaml
