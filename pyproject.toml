[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spintexture-theory-agent"
version = "0.1.0"
description = "Mathematica-centered symbolic derivation agent for magnetic texture dynamics"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pyyaml>=6.0",
  "pydantic>=2.0",
  "rich>=13.0",
  "jinja2>=3.1"
]

[project.optional-dependencies]
analysis = ["matplotlib>=3.8"]
cross-engine = ["sympy>=1.13,<2", "mpmath>=1.3,<2"]
dev = ["pytest>=8.0", "ruff>=0.5", "matplotlib>=3.8"]

[project.scripts]
spintexture-agent = "spintexture_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
spintexture_agent = [
  "templates/*.j2",
  "knowledge_base/*.yaml",
  "mathematica/*.wl",
]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
pythonpath = ["src"]
